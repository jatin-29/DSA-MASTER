name: Deploy to GitHub Pages
on:
  push:
    branches: [claude/dsa-resources-aggregator-yrc770]
  schedule: [{ cron: "17 */6 * * *" }]   # daily refresh of playlists
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp && python scripts/fetch.py && (python scripts/fetch_sheets.py || true) && (python scripts/fetch_contests.py || true)
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
